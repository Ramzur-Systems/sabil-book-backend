log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ':443'

  flower:
    address: ':5555'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'daniel-roy-greenfeld@example.com'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    # More specific than web-secure-router below (Host + PathPrefix vs. Host
    # alone), so Traefik's default rule-length-based priority matches this
    # one first for anything under /ws/ and routes it to the ASGI (daphne)
    # service instead of gunicorn, which can't speak WebSocket.
    websocket-secure-router:
      rule: '(Host(`example.com`) || Host(`www.example.com`)) && PathPrefix(`/ws/`)'
      entryPoints:
        - web-secure
      service: websocket
      tls:
        certResolver: letsencrypt

    web-secure-router:
      rule: 'Host(`example.com`) || Host(`www.example.com`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://doc.traefik.io/traefik/routing/routers/#certresolver
        certResolver: letsencrypt

    # Signed result downloads. Uploads go from Django to SeaweedFS over the
    # internal network, so the internet only ever needs GET and HEAD. Host is
    # passed through unchanged, which SigV4 signature checks depend on.
    files-secure-router:
      rule: 'Host(`files.example.com`) && (Method(`GET`) || Method(`HEAD`))'
      entryPoints:
        - web-secure
      service: seaweedfs
      tls:
        certResolver: letsencrypt

    flower-secure-router:
      rule: 'Host(`example.com`)'
      entryPoints:
        - flower
      service: flower
      tls:
        # https://doc.traefik.io/traefik/master/routing/routers/#certresolver
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    websocket:
      loadBalancer:
        servers:
          - url: http://websocket:5001

    flower:
      loadBalancer:
        servers:
          - url: http://flower:5555

    seaweedfs:
      loadBalancer:
        servers:
          - url: http://seaweedfs:8333

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
