volumes:
  clamav_data: {}
  sabil_book_local_postgres_data: {}
  sabil_book_local_postgres_data_backups: {}
  sabil_book_local_redis_data: {}
  sabil_book_local_seaweedfs_data: {}

services:
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    # clamd has no authentication: keep port 3310 inside the Compose network.

  seaweedfs:
    build:
      context: .
      dockerfile: ./compose/production/seaweedfs/Dockerfile
    image: sabil_book_local_seaweedfs
    container_name: sabil_book_local_seaweedfs
    env_file:
      - ./.envs/.local/.attachments
    volumes:
      - sabil_book_local_seaweedfs_data:/data
    # Only the S3 API, and only on this machine: browsers follow signed
    # download URLs to http://localhost:8333.
    ports:
      - '127.0.0.1:8333:8333'
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/seaweedfs-ready']
      interval: 2s
      timeout: 2s
      retries: 60

  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: sabil_book_local_django
    container_name: sabil_book_local_django
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailhog:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
      - ./.envs/.local/.attachments
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sabil_book_production_postgres
    container_name: sabil_book_local_postgres
    volumes:
      - sabil_book_local_postgres_data:/var/lib/postgresql
      - sabil_book_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  redis:
    image: docker.io/redis:8.10
    container_name: sabil_book_local_redis
    volumes:
      - sabil_book_local_redis_data:/data

  mailhog:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: sabil_book_local_mailhog
    ports:
      - '8025:8025'

  celeryworker:
    <<: *django
    image: sabil_book_local_celeryworker
    container_name: sabil_book_local_celeryworker
    depends_on:
      clamav:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: sabil_book_local_celerybeat
    container_name: sabil_book_local_celerybeat
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: sabil_book_local_flower
    container_name: sabil_book_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
